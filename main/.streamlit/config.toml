[client]
# Pas de bouton Deploy ni d'options de développeur : le menu ⋮ garde l'impression et le choix du thème.
toolbarMode = "viewer"

[theme]
font = "Archivo, sans-serif"
baseRadius = "small"
# h1 à h6 : une échelle courte, pour un document de travail plutôt qu'une affiche.
headingFontSizes = ["2.25rem", "1.5rem", "1.2rem", "1rem", "0.875rem", "0.75rem"]
headingFontWeights = [700, 650, 650, 600, 600, 600]
metricValueFontSize = "2rem"

# Deux palettes : l'app suit le mode clair ou sombre du système, et le menu ⋮ permet de changer.
# Le rouge n'est pas dans le thème : il est réservé aux données (feux, danger élevé).
[theme.light]
primaryColor = "#2f6b4c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f4f3"
textColor = "#1c2a24"
borderColor = "#d3dad6"

[theme.dark]
primaryColor = "#7fbf98"
backgroundColor = "#111915"
secondaryBackgroundColor = "#1b2520"
textColor = "#e4e9e6"
borderColor = "#33413a"
